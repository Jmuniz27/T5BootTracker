name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  claude-review:
    name: Automated Claude Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post "review in progress" comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "🤖 **Claude PR Review in progress...** I'll check this PR for RBAC issues, security problems, test coverage, and code quality. Results will appear as a review shortly."

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude PR review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p "Use the pr-reviewer agent to review PR #${{ github.event.pull_request.number }} on the Boot-Tracker repo. \
            Get the diff with 'gh pr diff ${{ github.event.pull_request.number }}', identify which modules changed (backend/frontend/mobile), \
            invoke the appropriate reviewer sub-agents (backend-reviewer, frontend-reviewer, mobile-reviewer) for each domain, \
            check that new views.py / services.py files have corresponding tests in backend/tests/, \
            check that migration files are mentioned in the PR body, \
            and then either approve or request changes using 'gh pr review ${{ github.event.pull_request.number }} --approve' \
            or 'gh pr review ${{ github.event.pull_request.number }} --request-changes --body ...' \
            Never approve if CI checks are still failing." \
            --allowedTools "Read,Grep,Glob,Bash(gh *),Bash(git *)" \
            --permission-mode acceptEdits \
            --max-turns 30
