<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td align="center" bgcolor="{{ button_color|default:'#213A8E' }}"
        style="border-radius:8px;background-color:{{ button_color|default:'#213A8E' }};">
      <a href="{{ button_url }}" target="_blank"
         style="display:inline-block;padding:13px 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">
        {{ button_label }}
      </a>
    </td>
  </tr>
</table>
<p style="margin:0 0 24px;font-size:12px;line-height:1.6;color:#6B7280;word-break:break-all;">
  Si el botón no funciona, copia y pega este enlace en tu navegador:<br>
  <a href="{{ button_url }}" style="color:#5B9BD5;">{{ button_url }}</a>
</p>
