name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boottracker
          POSTGRES_PASSWORD: boottracker123
          POSTGRES_DB: boottracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements/local.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/local.txt

      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --select E,F,W --ignore E501

      - name: Run migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          DB_NAME: boottracker_test
          DB_USER: boottracker
          DB_PASSWORD: boottracker123
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:5173
        run: python manage.py migrate

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          DB_NAME: boottracker_test
          DB_USER: boottracker
          DB_PASSWORD: boottracker123
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:5173
        run: pytest -v --tb=short
