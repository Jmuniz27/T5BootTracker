# Preserva el X-Forwarded-Proto que haya puesto un proxy anterior (el nginx del host,
# Traefik, un load balancer). Si no hay ninguno, cae a $scheme.
#
# Sin esto, mandar `X-Forwarded-Proto $scheme` pisaba el valor original con "http" —
# porque el salto proxy→contenedor siempre es http— y Django, que tiene
# SECURE_SSL_REDIRECT=True y SECURE_PROXY_SSL_HEADER en config/settings/production.py,
# respondía con un redirect a https en bucle infinito.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    # Los comprobantes aceptan hasta 10 MB (validado en el backend); el default
    # de nginx es 1 MB y devolvía 413 antes de llegar a Django.
    client_max_body_size 15m;

    # 1. Serve the React static files and fix the 404 reload error
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy /api requests directly to the Django backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 3. Proxy /media requests directly to the Django backend container
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 4. Proxy /health/ al backend.
    #    Mismo problema que /static/: sin este bloque caía en el try_files de la SPA y
    #    devolvía index.html con 200, así que la sonda daba "sano" aunque el backend
    #    estuviera caído. El endpoint real (config/health.py) verifica también la BD.
    location /health/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 5. Proxy /admin/ al backend — el panel de administración de Django.
    #    Sin este bloque caía en el try_files de la SPA: /admin/ devolvía el
    #    index.html de React con un 200, así que el admin era inalcanzable y un
    #    POST de login respondía 405. Como efecto secundario, /api/docs/ tampoco
    #    servía: exige IsAdminUser y no había forma de iniciar la sesión.
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 6. Proxy /static requests al backend — los sirve WhiteNoise.
    #    Sin este bloque, /static/ caía en el try_files de la SPA y devolvía index.html,
    #    con lo que el Django admin quedaba sin CSS ni JS.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
