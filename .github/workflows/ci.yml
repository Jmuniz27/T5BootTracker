name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: boottracker_test
          POSTGRES_USER: boottracker_user
          POSTGRES_PASSWORD: boottracker_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements/local.txt

      - name: Run Django checks
        env:
          SECRET_KEY: ci-secret-key-not-real
          DEBUG: True
          DB_NAME: boottracker_test
          DB_USER: boottracker_user
          DB_PASSWORD: boottracker_pass
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          cd backend
          python manage.py check
          python manage.py migrate
          python manage.py test --verbosity=2

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build check
        run: |
          cd frontend
          npm ci
          npm run build
