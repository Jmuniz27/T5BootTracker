name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    name: Backend — Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for docker compose
        run: |
          cat <<EOF > .env
          SECRET_KEY=ci-secret-key-not-for-production
          DEBUG=True
          DB_NAME=boottracker_test
          DB_USER=boottracker
          DB_PASSWORD=boottracker123
          DB_HOST=db
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend — run Django system check
        run: docker compose exec -T backend python manage.py check

      # Detecta cambios en modelos sin su migración: si falta, el deploy
      # arranca contra un esquema que no coincide con el código.
      - name: Check for missing migrations
        run: docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: docker compose exec -T backend pytest --tb=short -q

      - name: Run linter
        run: docker compose exec -T backend python -m ruff check . --select E,F,W --ignore E501

      # Bloqueante desde el hardening de S6: con continue-on-error, los
      # hallazgos de seguridad se registraban y nadie los veía.
      - name: Security scan (bandit)
        run: docker compose exec -T backend bandit -r apps/ -ll

      - name: Type check (mypy)
        continue-on-error: true
        run: docker compose exec -T backend mypy apps/ --ignore-missing-imports

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-ci:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Build check
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm run test

  mobile-ci:
    name: Mobile — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: mobile
        run: npm run lint

      - name: Run tests
        working-directory: mobile
        run: npm run test -- --passWithNoTests

  # Construir y publicar está separado de desplegar a propósito: el primer arranque en el
  # servidor se hace a mano (Fase 4) y necesita las imágenes en GHCR antes de que exista
  # ningún automatismo. Si estuvieran en el mismo job, para tener imágenes habría que
  # encender el deploy, y ese es justo el orden que no queremos.
  build-push:
    name: Construir y publicar imágenes (GHCR)
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Los builds corren acá y no en el VPS: la caja tiene 2 vCPU y 3.7 GiB
      # compartidos con otra aplicación en producción.
      #
      # El tag del SHA se publica siempre; `latest`, sólo desde main. Hoy el trigger es
      # únicamente main, pero la condición se conserva: si alguna vez se vuelve a habilitar
      # una rama para publicar imágenes de prueba (como se hizo para el primer despliegue),
      # esa rama no puede mover `latest` y el "sólo main llega a producción" sigue en pie.
      # El tag del SHA es además lo que hace posible el rollback: deploy.sh <sha-anterior>.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/jmuniz27/boot-tracker-backend:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/jmuniz27/boot-tracker-backend:latest' || '' }}
          # El deploy.sh del servidor limpia imágenes viejas filtrando por esta label.
          # Sin ella, el prune no tendría con qué distinguirlas de las de la otra app.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/jmuniz27/boot-tracker-frontend:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/jmuniz27/boot-tracker-frontend:latest' || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imágenes publicadas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/jmuniz27/boot-tracker-backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/jmuniz27/boot-tracker-frontend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy a producción (VPS Hetzner)
    needs: [build-push]
    # Sólo main, sólo en push (no en PRs), y sólo si el despliegue está habilitado.
    # DEPLOY_ENABLED es una variable de repositorio (Settings → Variables). Mientras no
    # exista o no valga 'true', este job se salta: así se puede mergear sin que falle
    # antes de que el servidor y los secrets estén listos.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      # La llave está restringida en authorized_keys con
      #   command="/opt/boot-tracker/deploy.sh",no-port-forwarding,no-agent-forwarding,no-pty
      # así que sólo puede ejecutar el despliegue: si el secret se filtrara, no abre shell.
      #
      # Se manda ÚNICAMENTE el SHA, no una línea de comando: con un `command=` forzado,
      # lo que se envía llega al servidor en $SSH_ORIGINAL_COMMAND, y el script lo lee de
      # ahí y lo valida contra ^[0-9a-f]{40}$ antes de usarlo.
      - name: Desplegar en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: ${{ github.sha }}
