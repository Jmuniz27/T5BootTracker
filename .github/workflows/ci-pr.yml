name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    name: Backend — Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for docker compose
        run: |
          cat <<EOF > .env
          SECRET_KEY=ci-secret-key-not-for-production
          DEBUG=True
          DB_NAME=boottracker_test
          DB_USER=boottracker
          DB_PASSWORD=boottracker123
          DB_HOST=db
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend — run Django system check
        run: docker compose exec -T backend python manage.py check

      - name: Run tests
        run: docker compose exec -T backend pytest --tb=short -q

      - name: Run linter
        run: docker compose exec -T backend python -m ruff check . --select E,F,W --ignore E501

      - name: Security scan (bandit)
        continue-on-error: true
        run: docker compose exec -T backend bandit -r apps/ -ll

      - name: Type check (mypy)
        continue-on-error: true
        run: docker compose exec -T backend mypy apps/ --ignore-missing-imports

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-ci:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Build check
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm run test

  mobile-ci:
    name: Mobile — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: mobile
        run: npm run lint

      - name: Run tests
        working-directory: mobile
        run: npm run test -- --passWithNoTests
