<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:16px 0;background-color:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;">
  {% for label, value in rows %}
  <tr>
    <td style="padding:10px 16px 0 16px;">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#6B7280;">{{ label }}</div>
      <div style="font-size:15px;color:#111827;padding-bottom:10px;">{{ value }}</div>
    </td>
  </tr>
  {% endfor %}
</table>
