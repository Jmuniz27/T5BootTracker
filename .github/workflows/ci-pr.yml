name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    name: Backend — Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for docker compose
        run: |
          cat <<EOF > .env
          SECRET_KEY=ci-secret-key-not-for-production
          DEBUG=True
          DB_NAME=boottracker_test
          DB_USER=boottracker
          DB_PASSWORD=boottracker123
          DB_HOST=db
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend — run Django system check
        run: docker compose exec -T backend python manage.py check

      - name: Run tests
        run: docker compose exec -T backend pytest --tb=short -q

      - name: Run linter
        run: docker compose exec -T backend ruff check .

      - name: Tear down
        if: always()
        run: docker compose down -v
