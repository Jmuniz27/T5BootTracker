# Keep the scheme the *outer* proxy reported. Django runs with
# SECURE_PROXY_SSL_HEADER + SECURE_SSL_REDIRECT, so overwriting this header with $scheme
# (always "http" on this hop) makes it redirect to https forever: the host nginx forwards
# the request back here and the loop never ends.
# Falls back to $scheme when there is no outer proxy, e.g. hitting port 8080 directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    # 1. Serve the React static files and fix the 404 reload error
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy /api requests directly to the Django backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 3. Proxy /media requests directly to the Django backend container
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 4. Whitenoise serves /static/ from Django. Without this the location / block below
    #    catches it and returns index.html, which leaves the Django admin without CSS.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
